[package]
name = "entropy-analysis"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
walkdir = "2.5"
plotters = "0.3.7"
thiserror = "1.0"
rayon = { version = "1.7", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.8"

[features]
default = ["parallel"]
parallel = ["rayon"]

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
